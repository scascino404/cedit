# Builds cedit and runs the tests on every system it supports, for every
# push and pull request. Each build's binary can be downloaded from the run's
# page, under Artifacts, as is the macOS disk image made from both Mac builds.
#
# Pushing a tag that starts with v (git tag v1.0 && git push origin v1.0)
# also publishes a GitHub release with the binaries attached, at stable
# names, so the newest one is always at
#   https://github.com/<owner>/cedit/releases/latest/download/<name>
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: built on the oldest Ubuntu at hand, as the binary won't
          # run on an older C library; from Ubuntu 22.04, it needs glibc 2.34
          - name: linux-x86_64
            os: ubuntu-22.04
          - name: linux-arm64
            os: ubuntu-22.04-arm
          # macOS: each built and tested on its own processor
          - name: macos-arm64
            os: macos-latest
          - name: macos-x86_64
            os: macos-26-intel
          - name: windows-x64
            os: windows-latest
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install the X11 and Wayland development files
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxext-dev \
            libxcursor-dev libxfixes-dev libxi-dev libxrandr-dev libxss-dev \
            libwayland-dev libxkbcommon-dev libegl-dev libdecor-0-dev \
            libdbus-1-dev libibus-1.0-dev

      # the 64-bit Visual C++ in the environment, as a Developer PowerShell
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64

      - name: Configure
        run: cmake --preset release

      - name: Build
        run: cmake --build --preset release

      - name: Test
        run: ctest --preset release

      # tar keeps the executable bit, which the Artifacts zip would lose
      - name: Package
        shell: bash
        run: |
          mkdir dist
          if [ "$RUNNER_OS" = Windows ]; then
            cp build/cedit.exe LICENSE dist/
            (cd dist && 7z a ../cedit-${{ matrix.name }}.zip cedit.exe LICENSE)
          elif [ "$RUNNER_OS" = Linux ]; then
            # with the launcher's entry and icon (see README.md)
            cp build/cedit LICENSE data/cedit.desktop data/cedit.svg dist/
            tar -czf cedit-${{ matrix.name }}.tar.gz -C dist cedit LICENSE \
              cedit.desktop cedit.svg
          else
            cp build/cedit LICENSE dist/
            tar -czf cedit-${{ matrix.name }}.tar.gz -C dist cedit LICENSE
          fi
          if [ "$RUNNER_OS" = Linux ]; then
            echo "Needs glibc $(objdump -T build/cedit | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)"
            ldd build/cedit
          elif [ "$RUNNER_OS" = macOS ]; then
            lipo -info build/cedit
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: cedit-${{ matrix.name }}
          path: cedit-${{ matrix.name }}.*
          if-no-files-found: error

  # macOS: one disk image for every Mac, holding cedit.app to drag into
  # Applications. Its program is the two macOS builds above, each tested on
  # its own processor, joined into one (a universal binary).
  macos-dmg:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: cedit-macos-*
          path: dist
          merge-multiple: true

      - name: Package
        run: |
          for arch in arm64 x86_64; do
            mkdir $arch
            tar -xzf dist/cedit-macos-$arch.tar.gz -C $arch
          done
          app=dmg/cedit.app/Contents
          mkdir -p $app/MacOS $app/Resources
          lipo -create arm64/cedit x86_64/cedit -output $app/MacOS/cedit
          lipo -info $app/MacOS/cedit
          cp data/Info.plist $app/
          cp data/cedit.icns LICENSE $app/Resources/
          # a release's version from its tag: v1.2 is 1.2
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            for key in CFBundleShortVersionString CFBundleVersion; do
              plutil -replace $key -string "${GITHUB_REF_NAME#v}" $app/Info.plist
            done
          fi
          plutil -lint $app/Info.plist
          # Signed ad hoc, by no one, but as a whole: macOS calls an app
          # whose files changed after its program was signed "damaged"
          codesign --force --sign - dmg/cedit.app
          codesign --verify --strict --verbose=2 dmg/cedit.app
          ln -s /Applications dmg/Applications
          # hdiutil on GitHub's Macs sometimes finds a resource busy
          for try in 1 2 3; do
            hdiutil create -volname cedit -srcfolder dmg -fs HFS+ \
              -format UDZO -ov cedit-macos.dmg && break
            sleep 10
          done
          hdiutil verify cedit-macos.dmg

      - uses: actions/upload-artifact@v7
        with:
          name: cedit-macos-dmg
          path: cedit-macos.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, macos-dmg]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # the downloads and how to install them, ahead of the changes
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --title "cedit $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md --generate-notes
